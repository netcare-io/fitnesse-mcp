services:
  fitnesse-mcp:
    container_name: fitnesse-mcp
    image: fitnesse-mcp:latest
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      target: production
    env_file:
      - .env
    environment:
      FASTMCP_TRANSPORT: http
      FASTMCP_HOST: 0.0.0.0
      FASTMCP_PORT: "8000"
    #ports:
    #  - "8000:8000"
    restart: unless-stopped
